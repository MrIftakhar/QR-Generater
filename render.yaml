services:
  - type: web
    name: qr-backend-api
    env: php
    region: oregon
    plan: free
    rootDir: qr-backend
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan config:clear && php artisan migrate --force && php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.tsxtmlguqdfgwgktzakp.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false